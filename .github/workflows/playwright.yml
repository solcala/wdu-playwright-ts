name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      CI: true
      HUSKY: 0
      BASE_URL: https://webdriveruniversity.com
    steps:
      - name: Check out the commit that triggered this run
        uses: actions/checkout@v7

      - name: Set up Node.js LTS inside the Playwright image
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies from package-lock.json
        run: npm ci

      - name: Lint TypeScript with ESLint
        run: npm run lint

      - name: Typecheck with tsc --noEmit
        run: npm run typecheck

      - name: Run Playwright tests and write the HTML report
        run: npx playwright test

      - name: Upload the HTML report to this Actions run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Add the report location to the job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Playwright HTML report"
            echo ""
            echo "- Image: \`mcr.microsoft.com/playwright:v1.64.1-noble\` (latest stable; pinned so it matches \`@playwright/test\` 1.64.1)"
            echo "- Base URL: \`$BASE_URL\`"
            echo "- Browsers: Chromium, already installed in the image. This job does not run \`playwright install\`."
            echo "- Report folder: \`playwright-report/\`"
            echo "- Artifact name: \`playwright-report\` (kept 30 days)"
            echo "- Published report: https://solcala.github.io/wdu-playwright-ts/ (updated only by pushes to \`main\`; this run's own report is the artifact above)"
            echo ""
            echo "On this run, open the **Summary** for failure annotations from the \`github\` reporter, and the **Artifacts** list for the HTML report."
            echo "Download \`playwright-report\`, unzip it, and open it with \`npx playwright show-report playwright-report\`."
            echo "Each \`test.step\` from the specs is listed inside that HTML report."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-report:
    name: Publish report to GitHub Pages
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Download the HTML report from the test job
        uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: playwright-report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Package the report for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
